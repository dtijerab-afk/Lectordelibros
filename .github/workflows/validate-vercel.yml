name: Validate Vercel deployment

on:
  push:
    branches:
      - vercel-deployment
  pull_request:
    branches:
      - vercel-deployment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend and prepare Vercel assets
        run: npm run build
